<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="top-bar" id="topbar">
        <div>
            <img src="./images/pfp.png" alt="ghost profile photo">
            <p id="welcomeopen">
                SomeOS
            </p> 
        </div>
        <p id="timeElement">
            loading time...
        </p>
    </div>

    <div class="window" id="welcome">
        <div class="handle" id="welcomeheader">
            <i class="fa-regular fa-circle-xmark" id="welcomeclose"></i>
        </div>
        <div class="window-content">
            <h1>Welcome to my OS</h1>
            <p>Hi, this is my first webOS. Hope you enjoy :)</p>
            <em><p>I LOVE HOT CHOCOLATE</p></em>
            <img src="./images/french-hot-chocolate.jpg" alt="french hot chocolate">
        </div>
    </div>

    <div class="desktop-apps" id="desktopApps">
        <div class="app-icon selected" id="notesopen">
            <img src="./images/notes-app-icon.png" alt="Notes app icon">
            <p>Notes</p>
        </div>
        
        <div class="app-icon selected" id="stopwatchopen">
            <img src="./images/stopwatch-app-icon.png" alt="Stopwatch app icon">
            <p>Stopwatch</p>
        </div>
    </div>

    <div id="notes" class="window">
        <div class="handle" id="notesheader">
            <i class="fa-regular fa-circle-xmark" id="notesclose"></i>
        </div>

        <div id="notesContent" class="window-content">
        </div>
    </div>

    <div id="stopwatch" class="window">
        <div class="handle" id="stopwatchheader">
            <i class="fa-regular fa-circle-xmark" id="stopwatchclose"></i>
        </div>

        <div id="stopwatchContent" class="window-content">
            <h1 id="stopwatchTime">00:00:00</h1>
            <div>
                <button type="button" onclick="startStopwatch()" id="stopwatchStartStopBtn">Start</button>
                <button type="button" onclick="resetStopwatch()">Reset</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
